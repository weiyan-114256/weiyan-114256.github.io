<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>反應力測試</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #222;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        display: flex;
        gap: 20px;
    }

    /* 左邊主點擊區 */
    #clickArea {
        width: 350px;
        height: 250px;
        background: linear-gradient(135deg, #001f3f, #001020);
        border: 3px solid #000;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
        font-size: 24px;
        font-weight: bold;
        color: white;
        transition: background 0.2s;
    }

    /* 右邊記錄區 */
    #recordBox {
        width: 180px;
        height: 250px;
        background: #555;
        border-radius: 8px;
        padding: 10px;
        overflow-y: auto;
        font-size: 18px;
    }

    .record-item {
        padding: 4px 0;
        border-bottom: 1px solid #888;
    }
</style>
</head>
<body>

<div class="container">
    <div id="clickArea">點擊開始</div>

    <div id="recordBox">
        <strong>反應時間紀錄</strong><br><br>
    </div>
</div>

<script>
    const clickArea = document.getElementById("clickArea");
    const recordBox = document.getElementById("recordBox");

    let state = "idle";  // idle → ready(red) → green
    let startTime;
    let timeoutID;

    clickArea.addEventListener("click", function () {
        if (state === "idle") {
            // 使用者剛開始測試
            clickArea.style.background = "red";
            clickArea.textContent = "綠色時點擊";
            state = "ready";

            // 隨機 1–5 秒後變綠
            let randomDelay = Math.random() * 4000 + 1000; 
            timeoutID = setTimeout(() => {
                clickArea.style.background = "green";
                clickArea.textContent = "點擊！";
                startTime = performance.now();
                state = "green";
            }, randomDelay);

        } else if (state === "ready") {
            // 提早點擊
            clearTimeout(timeoutID);
            clickArea.style.background = "linear-gradient(135deg, #001f3f, #001020)";
            clickArea.textContent = "太快了！重新開始";
            state = "idle";
        } else if (state === "green") {
            // 正確時機點擊，計算時間
            let reaction = (performance.now() - startTime) / 1000;
            let formatted = reaction.toFixed(4);

            // 紀錄到右邊方框
            let div = document.createElement("div");
            div.className = "record-item";
            div.textContent = formatted + " 秒";
            recordBox.appendChild(div);

            // 重置
            clickArea.style.background = "linear-gradient(135deg, #001f3f, #001020)";
            clickArea.textContent = "點擊開始";
            state = "idle";
        }
    });
</script>

</body>
</html>
