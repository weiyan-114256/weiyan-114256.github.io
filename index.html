<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>反應速度測試</title>
    <style>
        body {
            margin: 0;
            background-color: #1e1e1e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        #container {
            display: flex;
            gap: 40px;
        }

        #testArea {
            width: 380px;
            height: 260px;
            background-color: #003060;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            cursor: pointer;
            user-select: none;
        }

        #recordArea {
            width: 260px;
            height: 260px;
            background-color: #272727;
            border-radius: 20px;
            color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        #recordArea h2 {
            margin-top: 0;
            text-align: center;
            font-size: 22px;
        }

        .record {
            font-size: 20px;
            margin: 5px 0;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        #averageBox {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 2px solid #555;
            font-size: 20px;
            text-align: center;
        }

        #popupContainer {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            pointer-events: none;
            z-index: 999;
            display: none;
        }
        #popupImg {
            max-width: 180px;
            max-height: 160px;
            display: block;
            margin: 0 auto;
        }
        #popupText {
            color: #BEBEBE;
            font-size: 26px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<!-- 先放 popup，這樣 JS 一定抓得到 -->
<div id="popupContainer">
    <img id="popupImg" src="">
    <div id="popupText"></div>
</div>

<div id="container">
    <div id="testArea">點擊開始</div>

    <div id="recordArea">
        <h2>反應紀錄</h2>
        <div id="records"></div>
        <div id="averageBox">平均：-- 秒</div>
    </div>
</div>

<script>
let testArea = document.getElementById("testArea");
let records = document.getElementById("records");
let averageBox = document.getElementById("averageBox");

let popupContainer = document.getElementById("popupContainer");
let popupImg = document.getElementById("popupImg");
let popupText = document.getElementById("popupText");

let hasStarted = false;
let readyToClick = false;
let startTime = 0;
let timeoutID = null;
let times = []; // 儲存反應時間

function updateAverage() {
    if (times.length === 0) {
        averageBox.textContent = "平均：-- 秒";
        return;
    }
    let avg = (times.reduce((a, b) => a + b, 0) / times.length).toFixed(4);
    averageBox.textContent = "平均：" + avg + " 秒";
}

// 圖片（你的三張）
let images = ["img1.png", "img2.png", "img3.png"];
let texts = ["快點快點!!!", "太遜了吧~~~", "就這?", "老奶奶都比你快"]; 

let preloaded = [];
for (let src of images) {
    let img = new Image();
    img.src = src;
    preloaded.push(img);
}

function showPopup() {
    popupImg.src = images[Math.floor(Math.random() * images.length)];
    popupText.textContent = texts[Math.floor(Math.random() * texts.length)];
    popupContainer.style.display = "block";
    setTimeout(() => {
        popupContainer.style.display = "none";
    }, 1000);
}

// 點擊邏輯

testArea.addEventListener("click", function () {
    if (!hasStarted) {
        hasStarted = true;
        testArea.style.backgroundColor = "#930000";
        testArea.textContent = "綠色時請點擊!";

        let delay = 1500 + Math.random() * 3500;
        timeoutID = setTimeout(() => {
            testArea.style.backgroundColor = "#007500";
            testArea.textContent = "點擊!";
            readyToClick = true;
            startTime = performance.now();
        }, delay);
        return;
    }

    if (hasStarted && !readyToClick) {
        testArea.textContent = "太早了! 重新開始";
        testArea.style.backgroundColor = "#003060";
        hasStarted = false;
        clearTimeout(timeoutID);
        return;
    }

    if (readyToClick) {
        let reactionSec = ((performance.now() - startTime) / 1000).toFixed(4);

        // ★ 大於 0.55 秒 → 跳出圖片
        if (parseFloat(reactionSec) > 0.55) showPopup();

        times.push(parseFloat(reactionSec));

        let div = document.createElement("div");
        div.className = "record";
        div.textContent = times.length + ".  " + reactionSec + " 秒";
        records.prepend(div);

        updateAverage();

        testArea.style.backgroundColor = "#003060";
        testArea.textContent = "點擊開始";
        hasStarted = false;
        readyToClick = false;
    }
});
</script>

</body>
</html>
